name: Build docs image

# Builds the docs site into a container and pushes it to GHCR. The main app's
# production stack (sangria repo → docker-compose.prod.yml) pulls this image and
# serves it behind Kong at sangria-docs.<domain>.
#
# Trigger: push to main (→ :latest + :sha) or a v* tag (→ :<tag>), or manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Compute tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/imonirulislam/sangria-docs:${{ steps.meta.outputs.tag }}
            ghcr.io/imonirulislam/sangria-docs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
