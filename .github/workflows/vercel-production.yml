# Production deployment to Vercel.
#
# One-time setup — add three repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       Vercel account token — https://vercel.com/account/tokens
#   VERCEL_ORG_ID      from `vercel link` (.vercel/project.json) or the project settings
#   VERCEL_PROJECT_ID  same source as VERCEL_ORG_ID
#
# If this repo is ALSO linked via Vercel's Git integration, turn its auto-deploys
# off so production isn't deployed twice — this workflow is the source of truth.
name: Deploy to Vercel (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Remote build on Vercel (no `vercel pull`): Vercel installs + builds server-side
      # using the project's own settings, so a project-scoped token is sufficient —
      # it never has to read settings/env locally.
      - name: Deploy to production
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
