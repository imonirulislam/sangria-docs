# Production deployment to Vercel.
#
# One-time setup — add three repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       Vercel account token — https://vercel.com/account/tokens
#   VERCEL_ORG_ID      from `vercel link` (.vercel/project.json) or the project settings
#   VERCEL_PROJECT_ID  same source as VERCEL_ORG_ID
#
# If this repo is ALSO linked via Vercel's Git integration, turn its auto-deploys
# off so production isn't deployed twice — this workflow is the source of truth.
name: Deploy to Vercel (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fumadocs builds with bun (bun.lockb); Vercel's CLI detects and uses it.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (production)
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
