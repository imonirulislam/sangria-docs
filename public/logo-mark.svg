<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sangriaTile" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C1E3A"/>
      <stop offset="1" stop-color="#3E0E1D"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="116" fill="url(#sangriaTile)"/>

  <!-- Citrus wheel mark -->
  <circle cx="256" cy="256" r="150" fill="#FFA51F"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="10"/>
  <circle cx="256" cy="256" r="118" fill="#FFC873"/>

  <!-- Radiating segments (8 wedges), like a citrus cross-section -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="256" x2="374" y2="256"/>
    <line x1="256" y1="256" x2="339" y2="339"/>
    <line x1="256" y1="256" x2="256" y2="374"/>
    <line x1="256" y1="256" x2="173" y2="339"/>
    <line x1="256" y1="256" x2="138" y2="256"/>
    <line x1="256" y1="256" x2="173" y2="173"/>
    <line x1="256" y1="256" x2="256" y2="138"/>
    <line x1="256" y1="256" x2="339" y2="173"/>
  </g>

  <!-- Juice-vesicle glints for a little texture/dimension -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="298" cy="228" r="7"/>
    <circle cx="222" cy="290" r="5"/>
    <circle cx="290" cy="300" r="4"/>
  </g>

  <!-- Center pith -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.9"/>
</svg>
